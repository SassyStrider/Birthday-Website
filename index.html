<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Ishu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Karla:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ambient background glow, color driven by current moment's mood -->
  <div class="ambient" id="ambient"></div>

  <!-- floating petals, subtle, always on -->
  <div class="petals" id="petals" aria-hidden="true"></div>

  <!-- ===================== START SCREEN ===================== -->
  <section id="start-screen" class="screen start-screen">
    <div class="start-content">
      <p class="eyebrow-heart">♡</p>
      <h1 class="start-title">Happy 19th,<br>Ishu</h1>
      <p class="start-sub">Every moment I could gather, in one place, for you.</p>
      <button class="btn-primary" id="begin-btn">Open it</button>
    </div>
  </section>

  <!-- ===================== MOMENT STAGE ===================== -->
  <section id="stage" class="screen stage hidden">
    <div class="stage-progress" id="stage-progress"></div>

    <div class="stage-inner" id="stage-inner">
      <!-- moment content injected here by app.js -->
    </div>

    <button class="nav-hit prev" id="prev-btn" aria-label="Previous moment"></button>
    <button class="nav-hit next" id="next-btn" aria-label="Next moment"></button>

    <div class="stage-footer">
      <span class="hint" id="hint">tap to continue ›</span>
    </div>
  </section>

  <!-- ===================== ENVELOPE / LETTER ===================== -->
  <section id="envelope-screen" class="screen envelope-screen hidden">
    <div class="envelope-wrap">
      <p class="envelope-lead">One last thing...</p>
      <div class="envelope" id="envelope">
        <div class="envelope-back"></div>
        <div class="envelope-flap"></div>
        <div class="envelope-seal" id="envelope-seal">♡</div>
        <div class="envelope-letter-peek"></div>
      </div>
      <p class="envelope-hint">click to open</p>
    </div>
  </section>

  <!-- ===================== FULL LETTER ===================== -->
  <section id="letter-screen" class="screen letter-screen hidden">
    <div class="letter-paper">
      <button class="letter-close" id="letter-close" aria-label="Close letter">✕</button>
      <h2 class="letter-title" id="letter-title"></h2>
      <div class="letter-body" id="letter-body"></div>
      <p class="letter-signoff">restart the journey ↺</p>
    </div>
  </section>

  <script src="moments.js"></script>
  <script src="app.js"></script>
</body>
</html>
